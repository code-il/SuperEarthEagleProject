# docker compose up --build   ->   http://localhost:8000
services:
  spherex-explorer:
    build: .
    ports: ["8000:8000"]
    environment:
      LOG_LEVEL: INFO
      SPHEREX_RATE_LIMIT_PER_MIN: "120"
      SPHEREX_MAX_CONCURRENT_JOBS: "3"
    volumes:
      - spherex-cache:/data/cache
    restart: unless-stopped
volumes:
  spherex-cache:
